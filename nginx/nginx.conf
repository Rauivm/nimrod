server {
    listen 80;

    server_name nimrod.raui.uk;

    client_max_body_size 100M;

    # FRONTEND
    location / {
        proxy_pass http://frontend:80;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # BACKEND API
    location /api/ {
        proxy_pass http://backend:3001/;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # BACKEND WS
    location /ws {
        proxy_pass http://backend:3001/ws;

        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";

        proxy_set_header Host $host;
    }

    # FOUNDRY BRIDGE — sync incremental de actors
    # O módulo Foundry (collector.js) envia para /bridge/sync e /bridge/sync/full.
    # O nginx roteia para o container foundry-bridge na rede Docker.
    # A porta 3999 NÃO é exposta publicamente — tráfego só via este proxy.
    location /bridge/ {
        proxy_pass http://foundry-bridge:3999/;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Timeouts generosos para fila de sync
        proxy_connect_timeout 10s;
        proxy_read_timeout    30s;
    }

    # FOUNDRY
    location /foundry/ {
        proxy_pass http://host.docker.internal:30001/foundry/;

        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_read_timeout 86400;
    }
}