server {
    listen 8081;
    server_name _;
 
    client_max_body_size 100M;
 
    # ── SPA Frontend ──────────────────────────────────────────────────────────
    location / {
        proxy_pass http://frontend:80;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_pass_request_headers on;
    }
 
    # ── Backend API ───────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://backend:3001/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Cloudflare Access headers precisam chegar ao backend intactos
        proxy_pass_request_headers on;
    }
 
    # ── WebSocket ─────────────────────────────────────────────────────────────
    location /ws {
        proxy_pass http://backend:3001/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host       $host;
        proxy_pass_request_headers on;
    }
 
    # ── Uploads estáticos ─────────────────────────────────────────────────────
    location /uploads/ {
        proxy_pass http://backend:3001/uploads/;
    }
 
    # ── Foundry VTT (rodando no host Linux na porta 30001) ───────────────────
    #
    # host-gateway é o IP do host Linux visto de dentro do container.
    # Configurado via extra_hosts no docker-compose.yml do nginx.
    # Não usa network_mode:host — Pi-hole continua na porta 80 sem conflito.
    #
    location /foundry/ {
        proxy_pass http://host-gateway:30001/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "Upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
 
        # Foundry usa WebSocket para sincronização — buffers desativados
        proxy_buffering    off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}