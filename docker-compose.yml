services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB:       ${POSTGRES_DB}
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:     ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout:  5s
      retries:  10
      start_period: 30s

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      PORT:         3001
      NODE_ENV:     production
      UPLOADS_DIR:  /app/uploads
      # DEV_USER_EMAIL: test@local.dev   ← descomente APENAS para testar localmente
      #                                    NUNCA deixar ativo em produção
    volumes:
      - uploads:/app/uploads
    # PRODUÇÃO: porta 3001 NÃO exposta — o Cloudflare Tunnel acessa via rede
    # interna do Docker (http://backend:3001). Expor a porta permitiria bypass
    # do Cloudflare Access.
    #
    # Para depurar localmente (fora de produção), descomente temporariamente:
    ports:
      - "127.0.0.1:3001:3001"   #← 127.0.0.1 garante que só o host local acessa

  frontend:
    build:
      context: ./frontend
      args:
        - VITE_API_BASE=/api
    restart: unless-stopped
    depends_on:
      - backend
    # PRODUÇÃO: porta 8088 também não precisa ser exposta se o Tunnel
    # aponta diretamente para este container. Comente se for o caso.
    ports:
      - "127.0.0.1:8088:80"

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    env_file:
      - .env
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - backend
      - frontend
    # cloudflared fica na mesma rede Docker que backend e frontend,
    # então acessa http://backend:3001 e http://frontend:80 diretamente,
    # sem precisar de portas expostas.

  nginx:
    image: nginx:alpine
    network_mode: host   # Usa a rede do host para acessar backend e frontend via localhost
    restart: unless-stopped
    extra_hosts:
      # Permite que o nginx acesse serviços no host Linux (ex: Foundry na :30001)
      # sem network_mode:host. Pi-hole na porta 80 do host não é afetado.
      - "host.docker.internal:host-gateway"
    depends_on:
      - frontend
      - backend
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:8081:8081" 

volumes:
  pgdata:
  uploads:
