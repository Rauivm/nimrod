services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      PORT: 3001
      NODE_ENV: production
      UPLOADS_DIR: /app/uploads
      # DEV_USER_EMAIL: test@local.dev   # descomente só quando precisar testar localmente
    volumes:
      - "/c/Users/rauiv/AppData/Local/FoundryVTT/Data:/foundrydata/Data"
      - uploads:/app/uploads
      - ./backend/src:/app/src          # ← Hot reload (muito útil no seu notebook)
    ports:
      - "3001:3001"

  frontend:
    build: 
      context: ./frontend
      args:
        - VITE_API_BASE=http://backend:3001   # Passa na hora do build
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8088:80"                          # Boa escolha (evita conflito com porta 80)
    environment:
      - VITE_API_BASE=http://backend:3001   # Backup (caso precise)

volumes:
  pgdata:
  uploads: