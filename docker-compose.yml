services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB:       ${POSTGRES_DB}
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:     ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout:  5s
      retries:  10
      start_period: 30s

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      PORT:         3001
      NODE_ENV:     production
      UPLOADS_DIR:  /app/uploads
      # DEV_USER_EMAIL: test@local.dev   ← descomente APENAS para testar localmente
      #                                    NUNCA deixar ativo em produção
    volumes:
      - uploads:/app/uploads
    # PRODUÇÃO: porta 3001 NÃO exposta — o Cloudflare Tunnel acessa via rede
    # interna do Docker (http://backend:3001). Expor a porta permitiria bypass
    # do Cloudflare Access.
    #
    # Para depurar localmente (fora de produção), descomente temporariamente:
    # ports:
    #   - "127.0.0.1:3001:3001"   ← 127.0.0.1 garante que só o host local acessa

  frontend:
    build:
      context: ./frontend
      args:
        - VITE_API_BASE=/api
    restart: unless-stopped
    depends_on:
      - backend
    # PRODUÇÃO: porta 8088 também não precisa ser exposta se o Tunnel
    # aponta diretamente para este container. Comente se for o caso.
    ports:
      - "127.0.0.1:8088:80"

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    network_mode: host
    command: tunnel --no-autoupdate run
    env_file:
      - .env
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - backend
      - frontend
    # cloudflared fica na mesma rede Docker que backend e frontend,
    # então acessa http://backend:3001 e http://frontend:80 diretamente,
    # sem precisar de portas expostas.

  # ── FOUNDRY BRIDGE ─────────────────────────────────────────────────────────
  # Recebe sync incremental do módulo Foundry via nginx (/bridge/*).
  # NÃO expõe porta publicamente — acessível apenas pela rede Docker interna.
  foundry-bridge:
    build: ./foundry-module/foundry-bridge
    restart: unless-stopped
    env_file:
      - .env
    environment:
      REDIS_HOST:      foundry-redis
      REDIS_PORT:      6379
      NIMROD_URL:      http://backend:3001/foundry/push-actors
      FOUNDRY_API_KEY: ${FOUNDRY_API_KEY}
    depends_on:
      foundry-redis:
        condition: service_healthy
    # porta NÃO exposta — nginx acessa por http://foundry-bridge:3999

  foundry-bridge-worker:
    build: ./foundry-module/foundry-bridge
    command: node src/worker.js
    restart: unless-stopped
    env_file:
      - .env
    environment:
      REDIS_HOST:      foundry-redis
      REDIS_PORT:      6379
      NIMROD_URL:      http://backend:3001/foundry/push-actors
      FOUNDRY_API_KEY: ${FOUNDRY_API_KEY}
    depends_on:
      foundry-redis:
        condition: service_healthy

  foundry-redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - foundry-redis-data:/data
    healthcheck:
      test:     ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout:  3s
      retries:  5

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:80"
    depends_on:
      - frontend
      - backend
      - foundry-bridge
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  pgdata:
  uploads:
  foundry-redis-data:
